name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (standalone)
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Package standalone output
        run: |
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf frontend-dist.tar.gz -C .next/standalone .

      - name: Upload frontend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-dist.tar.gz"
          target: "~/"

      - name: Deploy backend (docker compose) on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f

      - name: Deploy frontend (systemd) on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo systemctl stop wedding-frontend
            rm -rf ~/wedding-frontend-new
            mkdir -p ~/wedding-frontend-new
            tar -xzf ~/frontend-dist.tar.gz -C ~/wedding-frontend-new
            rm -rf ~/wedding-frontend
            mv ~/wedding-frontend-new ~/wedding-frontend
            sudo systemctl start wedding-frontend
            rm -f ~/frontend-dist.tar.gz
