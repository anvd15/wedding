services:
  mongodb:
    image: mongo:7.0
    container_name: wedding_mongodb
    restart: unless-stopped
    # Giới hạn WiredTiger cache cho máy RAM thấp (ví dụ AWS 1GB/2vCPU).
    # Không set thì Mongo tự tính cache theo RAM tổng của máy và dễ chiếm quá nhiều,
    # làm Next.js/Express bị OOM-kill khi cùng chạy trên 1 máy.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=wedding_db
    volumes:
      - mongo_data:/data/db
    networks:
      - wedding_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedding_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/wedding_db
      - NODE_ENV=production
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - wedding_net

volumes:
  mongo_data:
    driver: local

networks:
  wedding_net:
    driver: bridge
