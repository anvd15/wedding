<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anh Yêu Em 💕</title>
  <meta name="description" content="Một lời tỏ tình lãng mạn và đẹp đẽ — Anh yêu em mãi mãi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,600&family=Outfit:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <!-- Floating particles canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Floating hearts -->
  <div class="hearts-container" id="heartsContainer"></div>

  <!-- Main content -->
  <main class="scene">
    <div class="glow-ring"></div>

    <div class="content">
      <p class="subtitle-top">✦ Từ trái tim anh ✦</p>

      <h1 class="main-title">
        <span class="word word-anh">Anh</span>
        <span class="word word-yeu">yêu</span>
        <span class="word word-em">em</span>
      </h1>

      <div class="divider">
        <span class="line"></span>
        <span class="heart-icon">♥</span>
        <span class="line"></span>
      </div>

      <p class="poem">
        Dù thời gian có trôi qua,<br />
        Dù khoảng cách có xa,<br />
        <em>Anh yêu em — mãi mãi.</em>
      </p>

      <div class="sparkle-row">
        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✧</span>
        <span class="sparkle s5">✦</span>
      </div>
    </div>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
